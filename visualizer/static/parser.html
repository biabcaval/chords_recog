<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChordMax — Chord Parser Debugger</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #242834;
    --border: #2e3345; --text: #e1e4ed; --text-muted: #8b90a0;
    --accent: #6c8cff; --match: #2dd4a0; --mismatch: #f0536a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 24px 32px;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .top-bar { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
  .top-bar h1 { font-size: 20px; font-weight: 600; color: var(--accent); }
  .top-bar .nav-link { font-size: 13px; }

  .input-section {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px; margin-bottom: 24px;
  }
  .input-row { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
  .chord-input {
    flex: 1; padding: 12px 16px; background: var(--surface2); border: 2px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 18px;
    font-family: 'JetBrains Mono', 'Fira Code', monospace; outline: none;
  }
  .chord-input:focus { border-color: var(--accent); }
  .parse-btn {
    padding: 12px 24px; background: var(--accent); border: none; border-radius: 8px;
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: opacity 0.15s;
  }
  .parse-btn:hover { opacity: 0.85; }
  .parse-btn:active { opacity: 0.7; }

  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .preset-btn {
    padding: 4px 10px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 4px; color: var(--text-muted); cursor: pointer; font-size: 12px;
    font-family: 'JetBrains Mono', 'Fira Code', monospace; transition: all 0.15s;
  }
  .preset-btn:hover { border-color: var(--accent); color: var(--text); }

  .result-header {
    display: flex; align-items: center; gap: 16px; margin-bottom: 16px;
  }
  .round-trip {
    padding: 4px 12px; border-radius: 6px; font-size: 13px; font-weight: 600;
  }
  .rt-match { background: #1a3a2a; color: var(--match); }
  .rt-mismatch { background: #3a1a1a; color: var(--mismatch); }

  .final-components {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 20px; margin-bottom: 20px; display: flex; gap: 8px; flex-wrap: wrap;
    align-items: center;
  }
  .comp-box {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: var(--surface2); border-radius: 6px; padding: 8px 12px;
    min-width: 60px;
  }
  .comp-box .comp-name { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
  .comp-box .comp-val {
    font-size: 16px; font-weight: 700;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
  }
  .comp-box .comp-idx { font-size: 10px; color: var(--text-muted); }
  .comp-val-active { color: var(--accent); }
  .comp-val-n { color: var(--text-muted); }

  .arrow-between { font-size: 20px; color: var(--text-muted); margin: 0 4px; }

  .pipeline { display: flex; flex-direction: column; gap: 12px; }

  .phase-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden;
  }
  .phase-header {
    padding: 10px 16px; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--border); cursor: pointer; user-select: none;
  }
  .phase-num {
    width: 24px; height: 24px; border-radius: 50%; background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .phase-name { font-size: 14px; font-weight: 600; flex: 1; }
  .phase-changes-badge {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    background: #2a2040; color: var(--accent);
  }
  .phase-no-change { font-size: 11px; color: var(--text-muted); }
  .phase-toggle { font-size: 10px; color: var(--text-muted); transition: transform 0.2s; }
  .phase-toggle.collapsed { transform: rotate(-90deg); }

  .phase-body { padding: 12px 16px; border-top: 1px solid var(--border); }
  .phase-body.collapsed { display: none; }
  .phase-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }

  .phase-output {
    background: var(--surface2); border-radius: 6px; padding: 10px 14px;
    font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px;
    white-space: pre-wrap; word-break: break-all;
  }

  .changes-list { margin-top: 8px; }
  .change-item {
    display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 4px;
  }
  .change-comp { font-weight: 600; min-width: 50px; }
  .change-from { color: var(--mismatch); text-decoration: line-through; }
  .change-arrow { color: var(--text-muted); }
  .change-to { color: var(--match); font-weight: 600; }
</style>
</head>
<body>

<div class="top-bar">
  <h1>Chord Parser Debugger</h1>
  <a class="nav-link" href="/">&larr; Back to Visualizer</a>
</div>

<div class="input-section">
  <div class="input-row">
    <input type="text" class="chord-input" id="chordInput" placeholder="Type a chord... e.g. C:maj7(9)/E" value="C:min7(b9,#11)/Eb">
    <button class="parse-btn" id="parseBtn" onclick="parseChord()">Parse</button>
  </div>
  <div class="presets" id="presets"></div>
</div>

<div id="resultArea" style="display:none">
  <div class="result-header">
    <span style="font-size:15px;font-weight:600">Result:</span>
    <span style="font-family:monospace;font-size:18px" id="inputLabel"></span>
    <span class="arrow-between">&rarr;</span>
    <span style="font-family:monospace;font-size:18px" id="reassembledLabel"></span>
    <span class="round-trip" id="roundTripBadge"></span>
  </div>

  <div class="final-components" id="finalComponents"></div>

  <div class="pipeline" id="pipeline"></div>
</div>

<script>
const PRESETS = [
  'C:maj', 'A:min', 'G:7', 'D:maj7', 'E:min7', 'F#:dim7', 'Bb:aug',
  'C:sus4', 'A:sus2', 'G:9', 'D:min9', 'F:maj7(#11)', 'C:13',
  'Ab:min7(b5)', 'C:hdim7', 'E:minmaj7', 'G:7(#9)', 'D:7(b9,b13)',
  'C:5', 'A:min6', 'G:maj7(9)/B', 'F:min/Ab', 'C:maj/5', 'A:min/b3',
  'N', 'X', 'Eb:dim7', 'C:sus4(b7,9)', 'D:aug7', 'B:7(#9,b13)',
  'C:min(*b3)', 'G:7(b9,#11,13)',
];

const COMP_NAMES = ['root','bass','triad','misc','6th','7th','9th','11th','13th'];

function initPresets() {
  const container = document.getElementById('presets');
  PRESETS.forEach(chord => {
    const btn = document.createElement('button');
    btn.className = 'preset-btn';
    btn.textContent = chord;
    btn.addEventListener('click', () => {
      document.getElementById('chordInput').value = chord;
      parseChord();
    });
    container.appendChild(btn);
  });
}

document.getElementById('chordInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') parseChord();
});

async function parseChord() {
  const chord = document.getElementById('chordInput').value.trim();
  if (!chord) return;

  const btn = document.getElementById('parseBtn');
  btn.textContent = '...';

  try {
    const resp = await fetch(`/api/debug_parse?chord=${encodeURIComponent(chord)}`);
    const data = await resp.json();
    renderResult(data);
  } catch (e) {
    console.error(e);
  } finally {
    btn.textContent = 'Parse';
  }
}

function renderResult(data) {
  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('inputLabel').textContent = data.input;
  document.getElementById('reassembledLabel').textContent = data.reassembled;

  const rtBadge = document.getElementById('roundTripBadge');
  if (data.round_trip_match) {
    rtBadge.className = 'round-trip rt-match';
    rtBadge.textContent = 'Round-trip OK';
  } else {
    rtBadge.className = 'round-trip rt-mismatch';
    rtBadge.textContent = 'Round-trip MISMATCH';
  }

  // Final components
  const compContainer = document.getElementById('finalComponents');
  compContainer.innerHTML = '';
  COMP_NAMES.forEach((comp, i) => {
    if (i > 0) {
      const sep = document.createElement('span');
      sep.className = 'arrow-between';
      sep.textContent = '';
      compContainer.appendChild(sep);
    }
    const box = document.createElement('div');
    box.className = 'comp-box';
    const val = data.final_components[comp] || 'N';
    const idx = data.indices[comp] ?? 0;
    const isActive = val !== 'N';
    box.innerHTML = `
      <span class="comp-name">${comp}</span>
      <span class="comp-val ${isActive ? 'comp-val-active' : 'comp-val-n'}">${val}</span>
      <span class="comp-idx">idx: ${idx}</span>
    `;
    compContainer.appendChild(box);
  });

  // Pipeline phases
  const pipeline = document.getElementById('pipeline');
  pipeline.innerHTML = '';

  data.phases.forEach((phase, idx) => {
    const card = document.createElement('div');
    card.className = 'phase-card';

    const header = document.createElement('div');
    header.className = 'phase-header';

    const num = document.createElement('span');
    num.className = 'phase-num';
    num.textContent = idx;

    const name = document.createElement('span');
    name.className = 'phase-name';
    name.textContent = phase.name;

    const toggle = document.createElement('span');
    toggle.className = 'phase-toggle';
    toggle.textContent = '\u25BC';

    header.appendChild(num);
    header.appendChild(name);

    if (phase.changes && Object.keys(phase.changes).length > 0) {
      const badge = document.createElement('span');
      badge.className = 'phase-changes-badge';
      const changedComps = Object.keys(phase.changes).join(', ');
      badge.textContent = `changed: ${changedComps}`;
      header.appendChild(badge);
    } else if (phase.changes) {
      const noChange = document.createElement('span');
      noChange.className = 'phase-no-change';
      noChange.textContent = 'no changes';
      header.appendChild(noChange);
    }

    header.appendChild(toggle);
    card.appendChild(header);

    const body = document.createElement('div');
    body.className = 'phase-body';

    const desc = document.createElement('div');
    desc.className = 'phase-desc';
    desc.textContent = phase.description;
    body.appendChild(desc);

    const output = document.createElement('div');
    output.className = 'phase-output';
    output.textContent = formatOutput(phase.output);
    body.appendChild(output);

    if (phase.changes && Object.keys(phase.changes).length > 0) {
      const changesList = document.createElement('div');
      changesList.className = 'changes-list';
      for (const [comp, change] of Object.entries(phase.changes)) {
        const item = document.createElement('div');
        item.className = 'change-item';
        item.innerHTML = `
          <span class="change-comp">${comp}</span>
          <span class="change-from">${change.from}</span>
          <span class="change-arrow">&rarr;</span>
          <span class="change-to">${change.to}</span>
        `;
        changesList.appendChild(item);
      }
      body.appendChild(changesList);
    }

    card.appendChild(body);

    header.addEventListener('click', () => {
      body.classList.toggle('collapsed');
      toggle.classList.toggle('collapsed');
    });

    pipeline.appendChild(card);
  });
}

function formatOutput(obj) {
  if (typeof obj === 'string') return obj;
  const lines = [];
  for (const [key, val] of Object.entries(obj)) {
    if (val === null || val === undefined) {
      lines.push(`${key}: null`);
    } else if (Array.isArray(val)) {
      lines.push(`${key}: [${val.join(', ')}]`);
    } else if (typeof val === 'object') {
      lines.push(`${key}:`);
      for (const [k2, v2] of Object.entries(val)) {
        lines.push(`  ${k2}: ${v2}`);
      }
    } else {
      lines.push(`${key}: ${val}`);
    }
  }
  return lines.join('\n');
}

initPresets();
parseChord();
</script>
</body>
</html>
