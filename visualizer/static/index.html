<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChordMax Visualizer</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242834;
    --border: #2e3345;
    --text: #e1e4ed;
    --text-muted: #8b90a0;
    --accent: #6c8cff;
    --match: #2dd4a0;
    --mismatch: #f0536a;
    --sidebar-w: 300px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; height: 100vh; overflow: hidden;
  }

  /* Sidebar */
  .sidebar { width: var(--sidebar-w); min-width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
  .sidebar-header h1 { font-size: 16px; font-weight: 600; color: var(--accent); margin-bottom: 12px; }
  .sidebar-header select, .sidebar-header input { width: 100%; padding: 8px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; margin-bottom: 8px; outline: none; }
  .sidebar-header select:focus, .sidebar-header input:focus { border-color: var(--accent); }
  .track-list { flex: 1; overflow-y: auto; padding: 4px 0; }
  .track-item { padding: 8px 16px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13px; transition: background 0.15s; border-left: 3px solid transparent; }
  .track-item:hover { background: var(--surface2); }
  .track-item.active { background: var(--surface2); border-left-color: var(--accent); }
  .track-badge { font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 600; }
  .badge-gt { background: #1a3a2a; color: var(--match); }
  .badge-pred { background: #3a1a2a; color: var(--mismatch); }
  .badge-both { background: #1a2a3a; color: var(--accent); }

  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .toolbar { padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; font-size: 13px; flex-wrap: wrap; }
  .toolbar .track-title { font-weight: 600; font-size: 15px; }
  .toolbar .match-badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .toggle-group { display: flex; gap: 4px; margin-left: auto; }
  .toggle-btn { padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 11px; transition: all 0.15s; }
  .toggle-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .charts-container { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }

  /* Cards (collapsible) */
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .card-header { padding: 10px 14px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
  .card-header h3 { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; flex: 1; margin: 0; }
  .card-header .card-toggle { font-size: 10px; color: var(--text-muted); transition: transform 0.2s; }
  .card-header .card-toggle.collapsed { transform: rotate(-90deg); }
  .card-btn { background: none; border: 1px solid var(--border); border-radius: 4px; color: var(--text-muted); cursor: pointer; padding: 2px 8px; font-size: 11px; transition: all 0.15s; }
  .card-btn:hover { color: var(--text); border-color: var(--text-muted); }
  .card-body { transition: max-height 0.3s ease; overflow: hidden; }
  .card-body.collapsed { max-height: 0 !important; }
  .chart-plot { width: 100%; }

  /* Fullscreen overlay */
  .fullscreen-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 1000; padding: 20px; flex-direction: column; }
  .fullscreen-overlay.active { display: flex; }
  .fullscreen-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .fullscreen-bar h3 { flex: 1; font-size: 15px; font-weight: 600; color: var(--text-muted); }
  .fullscreen-plot { flex: 1; }

  /* Table */
  .table-controls { padding: 8px 14px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--border); }
  .table-filter-btn { padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 11px; }
  .table-filter-btn.active { background: var(--mismatch); color: #fff; border-color: var(--mismatch); }
  .table-wrap { max-height: 400px; overflow-y: auto; }
  .chord-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .chord-table th { position: sticky; top: 0; background: var(--surface2); padding: 6px 10px; text-align: left; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--border); cursor: pointer; white-space: nowrap; user-select: none; }
  .chord-table th:hover { color: var(--text); }
  .chord-table th .sort-arrow { margin-left: 4px; font-size: 9px; }
  .chord-table td { padding: 5px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .chord-table tr { cursor: pointer; transition: background 0.1s; }
  .chord-table tbody tr:hover { background: var(--surface2); }
  .chord-table tr.row-match td:first-child { border-left: 3px solid var(--match); }
  .chord-table tr.row-mismatch td:first-child { border-left: 3px solid var(--mismatch); }
  .cell-match { color: var(--match); }
  .cell-mismatch { color: var(--mismatch); font-weight: 600; }
  .cell-chord { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
  .comp-pill { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 10px; margin: 0 1px; }
  .comp-ok { background: #1a3a2a; color: var(--match); }
  .comp-err { background: #3a1a1a; color: var(--mismatch); }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px; }
  .stats-column { display: flex; flex-direction: column; gap: 10px; }
  .stats-column h4 { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; border-bottom: 1px solid var(--border); }
  .stat-label { color: var(--text-muted); }
  .stat-value { font-weight: 600; }
  .stat-bar-wrap { margin-top: 6px; }
  .stat-bar-row { display: flex; align-items: center; gap: 6px; font-size: 11px; margin-bottom: 3px; }
  .stat-bar-label { width: 70px; text-align: right; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; }
  .stat-bar-track { flex: 1; height: 14px; background: var(--surface2); border-radius: 3px; overflow: hidden; position: relative; }
  .stat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
  .stat-bar-pct { width: 40px; font-size: 10px; color: var(--text-muted); }

  /* Head accuracy */
  .head-accuracy-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; padding: 14px; }
  .head-card { background: var(--surface2); border-radius: 6px; padding: 10px; }
  .head-card .head-name { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
  .head-card .head-acc { font-size: 22px; font-weight: 700; }
  .head-card .head-errors { margin-top: 6px; font-size: 10px; color: var(--text-muted); }
  .head-card .head-error-item { margin-top: 2px; }

  .empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 15px; flex-direction: column; gap: 8px; }
  .empty-state .hint { font-size: 13px; opacity: 0.6; }
  .detail-panel { background: var(--surface); border-top: 1px solid var(--border); padding: 12px 20px; font-size: 13px; display: none; }
  .detail-panel.visible { display: flex; gap: 24px; flex-wrap: wrap; }
  .detail-item { display: flex; gap: 6px; }
  .detail-label { color: var(--text-muted); }
  .detail-value { font-weight: 600; }

  .track-list::-webkit-scrollbar, .charts-container::-webkit-scrollbar, .table-wrap::-webkit-scrollbar { width: 6px; }
  .track-list::-webkit-scrollbar-thumb, .charts-container::-webkit-scrollbar-thumb, .table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h1>ChordMax Visualizer</h1>
    <a href="/parser" style="font-size:11px;color:var(--accent);text-decoration:none;margin-bottom:8px;display:block">Parser Debugger &rarr;</a>
    <select id="datasetSelect"><option value="">Select dataset...</option></select>
    <select id="inferenceSelect"><option value="">Select inference directory...</option></select>
    <input type="text" id="searchInput" placeholder="Search tracks...">
    <div id="datasetInfo" style="font-size:11px;color:var(--text-muted);margin-top:4px;display:none"></div>
  </div>
  <div class="track-list" id="trackList"></div>
</div>

<div class="main">
  <div class="toolbar" id="toolbar" style="display:none">
    <span class="track-title" id="trackTitle"></span>
    <span class="match-badge" id="matchBadge"></span>
    <div class="toggle-group" id="componentToggles"></div>
  </div>
  <div class="charts-container" id="chartsContainer">
    <div class="empty-state" id="emptyState">
      <span>Select a track to visualize</span>
      <span class="hint">Choose a dataset and inference directory, then click a track</span>
    </div>
  </div>
  <div class="detail-panel" id="detailPanel">
    <div class="detail-item"><span class="detail-label">Time:</span><span class="detail-value" id="detailTime">-</span></div>
    <div class="detail-item"><span class="detail-label">GT:</span><span class="detail-value" id="detailGT">-</span></div>
    <div class="detail-item"><span class="detail-label">Pred:</span><span class="detail-value" id="detailPred">-</span></div>
  </div>
</div>

<div class="fullscreen-overlay" id="fullscreenOverlay">
  <div class="fullscreen-bar">
    <h3 id="fullscreenTitle"></h3>
    <button class="card-btn" onclick="closeFullscreen()">Close (Esc)</button>
  </div>
  <div class="fullscreen-plot" id="fullscreenPlot"></div>
</div>

<script>
const ROOT_COLORS = {
  'C':'#e74c3c','C#':'#e67e22','D':'#f1c40f','D#':'#2ecc71',
  'E':'#1abc9c','F':'#3498db','F#':'#6c5ce7','G':'#9b59b6',
  'G#':'#e84393','A':'#fd79a8','A#':'#fdcb6e','B':'#00cec9','N':'#636e72',
};
const MATCH_COLOR = 'rgba(45,212,160,0.6)';
const MISMATCH_COLOR = 'rgba(240,83,106,0.6)';
const COMP_NAMES = ['root','bass','triad','misc','6th','7th','9th','11th','13th'];

const PLB = {
  paper_bgcolor:'#1a1d27', plot_bgcolor:'#1a1d27',
  font:{color:'#e1e4ed',size:11}, margin:{l:80,r:20,t:10,b:30},
  xaxis:{gridcolor:'#2e3345',zerolinecolor:'#2e3345',title:''},
  yaxis:{gridcolor:'#2e3345',zerolinecolor:'#2e3345'},
  showlegend:false, hovermode:'closest',
};
const PCFG = { displayModeBar:true, modeBarButtonsToRemove:['lasso2d','select2d','autoScale2d'], displaylogo:false, responsive:true };

let currentTrackData=null, currentTrackId=null, currentGtDir=null, currentDataset=null, allDatasets=[];
let visibleComponents = new Set(COMP_NAMES);
let allPlotIds=[], tableShowOnlyErrors=false;

async function fetchJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json();}

// ── Card helpers ──

function createCard(title, opts={}) {
  const card = document.createElement('div');
  card.className = 'chart-card';

  const header = document.createElement('div');
  header.className = 'card-header';

  const toggle = document.createElement('span');
  toggle.className = 'card-toggle';
  toggle.textContent = '\u25BC';

  const h3 = document.createElement('h3');
  h3.textContent = title;

  header.appendChild(toggle);
  header.appendChild(h3);

  if (opts.fullscreen) {
    const fsBtn = document.createElement('button');
    fsBtn.className = 'card-btn';
    fsBtn.textContent = '\u26F6 Fullscreen';
    fsBtn.addEventListener('click', (e) => { e.stopPropagation(); opts.fullscreen(); });
    header.appendChild(fsBtn);
  }

  card.appendChild(header);

  const body = document.createElement('div');
  body.className = 'card-body';
  card.appendChild(body);

  header.addEventListener('click', () => {
    body.classList.toggle('collapsed');
    toggle.classList.toggle('collapsed');
  });

  return { card, body };
}

// ── Fullscreen ──

let fullscreenTracesCache = null, fullscreenLayoutCache = null, fullscreenTitleCache = '';

function openFullscreen(title, traces, layout) {
  fullscreenTitleCache = title;
  fullscreenTracesCache = traces;
  fullscreenLayoutCache = layout;
  document.getElementById('fullscreenTitle').textContent = title;
  const overlay = document.getElementById('fullscreenOverlay');
  overlay.classList.add('active');
  const plotDiv = document.getElementById('fullscreenPlot');
  const fsLayout = { ...layout, height: undefined, margin: { l: 80, r: 40, t: 20, b: 50 } };
  Plotly.newPlot(plotDiv, traces, fsLayout, { ...PCFG, responsive: true });
}

function closeFullscreen() {
  document.getElementById('fullscreenOverlay').classList.remove('active');
  Plotly.purge(document.getElementById('fullscreenPlot'));
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeFullscreen();
});

// ── Init ──

async function init(){
  await fetchJSON('/api/config');
  await loadDatasets();
  await loadInferenceDirs();
  document.getElementById('datasetSelect').addEventListener('change',async(e)=>{
    currentDataset=e.target.value||null; updateDatasetInfo(); await loadTracks();
  });
  document.getElementById('inferenceSelect').addEventListener('change',async()=>{
    await loadTracks(); if(currentTrackId) await reselectCurrentTrack();
  });
  document.getElementById('searchInput').addEventListener('input',filterTracks);
  if(allDatasets.length>0){
    document.getElementById('datasetSelect').value=allDatasets[0].name;
    currentDataset=allDatasets[0].name; updateDatasetInfo(); await loadTracks();
  }
}

async function loadDatasets(){
  try{allDatasets=await fetchJSON('/api/datasets');const s=document.getElementById('datasetSelect');
  allDatasets.forEach(d=>{const o=document.createElement('option');o.value=d.name;o.textContent=`${d.name} (${d.track_count} tracks)`;s.appendChild(o);});}catch(e){console.warn(e);}
}

function updateDatasetInfo(){
  const el=document.getElementById('datasetInfo');
  if(!currentDataset){el.style.display='none';return;}
  const ds=allDatasets.find(d=>d.name===currentDataset);
  if(!ds){el.style.display='none';return;}
  el.innerHTML=`${ds.track_count} tracks &middot; ${(ds.total_duration_s/60).toFixed(1)} min &middot; ${ds.unique_chords} unique chords`;
  el.style.display='block';
}

async function loadInferenceDirs(){
  try{const dirs=await fetchJSON('/api/inference_dirs');const s=document.getElementById('inferenceSelect');
  dirs.forEach(d=>{const o=document.createElement('option');o.value=d.path;o.textContent=`${d.name} (${d.track_count} tracks)`;s.appendChild(o);});}catch(e){console.warn(e);}
}

async function loadTracks(){
  const p=new URLSearchParams();
  if(currentDataset)p.set('dataset',currentDataset);
  const pd=document.getElementById('inferenceSelect').value;
  if(pd)p.set('pred_dir',pd);
  try{const t=await fetchJSON(`/api/tracks?${p}`);renderTrackList(t);}catch(e){console.warn(e);}
}

function renderTrackList(tracks){
  const list=document.getElementById('trackList'); list.innerHTML='';
  tracks.forEach(t=>{
    const el=document.createElement('div'); el.className='track-item';
    if(t.track_id===currentTrackId)el.classList.add('active');
    el.dataset.trackId=t.track_id; if(t.gt_dir)el.dataset.gtDir=t.gt_dir;
    let badge='';
    if(t.has_gt&&t.has_pred)badge='<span class="track-badge badge-both">GT+Pred</span>';
    else if(t.has_gt)badge='<span class="track-badge badge-gt">GT</span>';
    else badge='<span class="track-badge badge-pred">Pred</span>';
    el.innerHTML=`<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.track_id}</span>${badge}`;
    el.addEventListener('click',()=>selectTrack(t.track_id,el)); list.appendChild(el);
  });
}

function filterTracks(){const q=document.getElementById('searchInput').value.toLowerCase();document.querySelectorAll('.track-item').forEach(el=>{el.style.display=el.dataset.trackId.toLowerCase().includes(q)?'':'none';});}

async function reselectCurrentTrack(){if(!currentTrackId)return;const el=document.querySelector(`.track-item[data-track-id="${currentTrackId}"]`);if(el)await selectTrack(currentTrackId,el);}

async function selectTrack(trackId,el){
  document.querySelectorAll('.track-item.active').forEach(e=>e.classList.remove('active'));
  if(el)el.classList.add('active');
  currentTrackId=trackId; currentGtDir=el?.dataset?.gtDir||null;
  const p=new URLSearchParams();
  if(currentDataset)p.set('dataset',currentDataset);
  const sv=document.getElementById('inferenceSelect').value;
  if(sv)p.set('pred_dir',sv); if(currentGtDir)p.set('gt_dir',currentGtDir);
  try{const data=await fetchJSON(`/api/track/${trackId}?${p}`);currentTrackData=data;renderVisualization(data);}catch(e){console.error(e);}
}

// ── Rendering ──

function renderVisualization(data){
  document.getElementById('toolbar').style.display='flex';
  document.getElementById('trackTitle').textContent=data.track_id;
  const badge=document.getElementById('matchBadge');
  if(data.match_ratio!==undefined){
    const pct=(data.match_ratio*100).toFixed(1);
    badge.textContent=`${pct}% match`;
    badge.style.background=data.match_ratio>0.7?'#1a3a2a':'#3a1a1a';
    badge.style.color=data.match_ratio>0.7?'#2dd4a0':'#f0536a';
  }else badge.textContent='';
  renderComponentToggles();
  const c=document.getElementById('chartsContainer'); c.innerHTML=''; allPlotIds=[];
  if(data.gt||data.pred) addChordTimeline(c,data);
  if(data.diff) addDiffTimeline(c,data);
  if(data.gt_stats||data.pred_stats) addStatsSection(c,data);
  if(data.head_accuracy) addHeadAccuracy(c,data);
  if(data.diff) addChordTable(c,data);
  if(data.component_diff) addComponentView(c,data);
}

function renderComponentToggles(){
  const g=document.getElementById('componentToggles'); g.innerHTML='';
  COMP_NAMES.forEach(comp=>{
    const btn=document.createElement('button');
    btn.className=`toggle-btn ${visibleComponents.has(comp)?'active':''}`;
    btn.textContent=comp;
    btn.addEventListener('click',()=>{visibleComponents.has(comp)?visibleComponents.delete(comp):visibleComponents.add(comp);btn.classList.toggle('active');if(currentTrackData)renderVisualization(currentTrackData);});
    g.appendChild(btn);
  });
}

// ── Chord color ──
function chordColor(chord){if(!chord||chord==='N'||chord==='X')return ROOT_COLORS['N'];return ROOT_COLORS[chord.split(':')[0]]||ROOT_COLORS['N'];}

// ── Chord Timeline ──

function addChordTimeline(container,data){
  const traces=[], maxT=Math.max(...(data.gt?.segments||[]).map(s=>s.end),...(data.pred?.segments||[]).map(s=>s.end),1);
  if(data.gt) traces.push(makeBarTrace(data.gt.segments,'GT',s=>chordColor(s.chord),s=>s.chord));
  if(data.pred) traces.push(makeBarTrace(data.pred.segments,'Pred',s=>chordColor(s.chord),s=>s.chord));
  const layout={...PLB,height:130,barmode:'stack',xaxis:{...PLB.xaxis,range:[0,maxT],title:'Time (s)'},yaxis:{...PLB.yaxis,fixedrange:true,autorange:'reversed'}};

  const {card,body}=createCard('Chord Timeline',{fullscreen:()=>openFullscreen('Chord Timeline',traces,{...layout,height:400})});
  const plotDiv=document.createElement('div');plotDiv.className='chart-plot';plotDiv.id='chordTimeline';
  body.appendChild(plotDiv);container.appendChild(card);allPlotIds.push(plotDiv.id);
  Plotly.newPlot(plotDiv,traces,layout,PCFG);
  setupClickHandler(plotDiv,data);
}

function makeBarTrace(segments,yLabel,colorFn,labelFn){
  return {
    type:'bar',orientation:'h',
    y:segments.map(()=>yLabel), x:segments.map(s=>s.end-s.start), base:segments.map(s=>s.start),
    marker:{color:segments.map(s=>colorFn(s)),line:{width:0.5,color:'#1a1d27'}},
    text:segments.map(s=>labelFn(s)), textposition:'inside', textfont:{size:10,color:'#fff'},
    hovertext:segments.map(s=>`${labelFn(s)}<br>${s.start.toFixed(2)}s - ${s.end.toFixed(2)}s`),
    hoverinfo:'text',
  };
}

// ── Diff Timeline ──

function addDiffTimeline(container,data){
  const maxT=Math.max(...data.diff.map(d=>d.end),1);
  const trace={
    type:'bar',orientation:'h',
    y:data.diff.map(()=>'Diff'), x:data.diff.map(d=>d.end-d.start), base:data.diff.map(d=>d.start),
    marker:{color:data.diff.map(d=>d.match?MATCH_COLOR:MISMATCH_COLOR),line:{width:0.3,color:'#1a1d27'}},
    text:data.diff.map(d=>d.match?'':`${d.gt_chord} \u2192 ${d.pred_chord}`),
    textposition:'inside',textfont:{size:9,color:'#fff'},
    hovertext:data.diff.map(d=>d.match?`${d.gt_chord} (match)<br>${d.start.toFixed(2)}s`:`GT: ${d.gt_chord}<br>Pred: ${d.pred_chord}<br>${d.start.toFixed(2)}s - ${d.end.toFixed(2)}s`),
    hoverinfo:'text',
  };
  const layout={...PLB,height:70,xaxis:{...PLB.xaxis,range:[0,maxT]},yaxis:{...PLB.yaxis,fixedrange:true}};

  const {card,body}=createCard('Match / Mismatch',{fullscreen:()=>openFullscreen('Match / Mismatch',[trace],{...layout,height:200})});
  const plotDiv=document.createElement('div');plotDiv.className='chart-plot';plotDiv.id='diffTimeline';
  body.appendChild(plotDiv);container.appendChild(card);allPlotIds.push(plotDiv.id);
  Plotly.newPlot(plotDiv,[trace],layout,PCFG);
}

// ── Statistics Section ──

function addStatsSection(container,data){
  const {card,body}=createCard('Statistics');
  const grid=document.createElement('div');grid.className='stats-grid';

  if(data.gt_stats) grid.appendChild(buildStatsColumn('Ground Truth',data.gt_stats,'var(--match)'));
  if(data.pred_stats) grid.appendChild(buildStatsColumn('Prediction',data.pred_stats,'var(--mismatch)'));

  body.appendChild(grid);
  container.appendChild(card);
}

function buildStatsColumn(title,stats,accentColor){
  const col=document.createElement('div');col.className='stats-column';
  const h4=document.createElement('h4');h4.textContent=title;h4.style.color=accentColor;
  col.appendChild(h4);

  const rows=[
    ['Duration',`${stats.total_duration_s}s (${(stats.total_duration_s/60).toFixed(1)} min)`],
    ['Segments',stats.num_segments],
    ['Unique chords',stats.unique_chords],
    ['Changes/min',stats.changes_per_min],
  ];
  rows.forEach(([l,v])=>{
    const r=document.createElement('div');r.className='stat-row';
    r.innerHTML=`<span class="stat-label">${l}</span><span class="stat-value">${v}</span>`;
    col.appendChild(r);
  });

  if(stats.top_chords&&stats.top_chords.length>0){
    const bw=document.createElement('div');bw.className='stat-bar-wrap';
    const maxPct=stats.top_chords[0].pct;
    stats.top_chords.slice(0,10).forEach(tc=>{
      const row=document.createElement('div');row.className='stat-bar-row';
      row.innerHTML=`<span class="stat-bar-label">${tc.chord}</span><div class="stat-bar-track"><div class="stat-bar-fill" style="width:${tc.pct/maxPct*100}%;background:${chordColor(tc.chord)}"></div></div><span class="stat-bar-pct">${tc.pct}%</span>`;
      bw.appendChild(row);
    });
    col.appendChild(bw);
  }

  return col;
}

// ── Head Accuracy ──

function addHeadAccuracy(container,data){
  const {card,body}=createCard('Per-Head Accuracy');
  const grid=document.createElement('div');grid.className='head-accuracy-grid';

  COMP_NAMES.forEach(comp=>{
    const ha=data.head_accuracy[comp];
    if(!ha)return;
    const hc=document.createElement('div');hc.className='head-card';
    const accColor=ha.accuracy_pct>=90?'var(--match)':ha.accuracy_pct>=70?'#fdcb6e':'var(--mismatch)';
    hc.innerHTML=`<div class="head-name">${comp}</div><div class="head-acc" style="color:${accColor}">${ha.accuracy_pct}%</div>`;

    if(ha.top_errors&&ha.top_errors.length>0){
      const errs=document.createElement('div');errs.className='head-errors';
      errs.innerHTML='<div style="margin-bottom:2px">Top errors:</div>';
      ha.top_errors.slice(0,3).forEach(e=>{
        errs.innerHTML+=`<div class="head-error-item">${e.pair} (${e.pct}%)</div>`;
      });
      hc.appendChild(errs);
    }
    grid.appendChild(hc);
  });

  body.appendChild(grid);
  container.appendChild(card);
}

// ── Chord Table ──

function addChordTable(container,data){
  const {card,body}=createCard('Segment Comparison (GT vs Pred)');
  const controls=document.createElement('div');controls.className='table-controls';
  const filterBtn=document.createElement('button');filterBtn.className='table-filter-btn';filterBtn.textContent='Show only errors';
  filterBtn.addEventListener('click',()=>{tableShowOnlyErrors=!tableShowOnlyErrors;filterBtn.classList.toggle('active',tableShowOnlyErrors);applyTableFilter(body);});
  const countInfo=document.createElement('span');countInfo.style.cssText='font-size:11px;color:var(--text-muted);margin-left:auto';
  const errors=data.diff.filter(d=>!d.match).length;
  countInfo.textContent=`${errors} errors / ${data.diff.length} segments`;
  controls.appendChild(filterBtn);controls.appendChild(countInfo);
  body.appendChild(controls);

  const wrap=document.createElement('div');wrap.className='table-wrap';
  const table=document.createElement('table');table.className='chord-table';
  const visComps=COMP_NAMES.filter(c=>visibleComponents.has(c));
  const thead=document.createElement('thead');const hr=document.createElement('tr');
  const headers=['Time','Duration','GT Chord','Pred Chord',...visComps];
  let sortCol=-1,sortAsc=true;
  headers.forEach((h,i)=>{
    const th=document.createElement('th');th.innerHTML=h+'<span class="sort-arrow"></span>';
    th.addEventListener('click',()=>{if(sortCol===i)sortAsc=!sortAsc;else{sortCol=i;sortAsc=true;}sortTableEl(table,sortCol,sortAsc);thead.querySelectorAll('.sort-arrow').forEach(s=>s.textContent='');th.querySelector('.sort-arrow').textContent=sortAsc?' \u25B2':' \u25BC';});
    hr.appendChild(th);
  });
  thead.appendChild(hr);table.appendChild(thead);

  const tbody=document.createElement('tbody');
  const compDiff=data.component_diff||{};
  data.diff.forEach(d=>{
    const tr=document.createElement('tr');tr.className=d.match?'row-match':'row-mismatch';tr.dataset.match=d.match?'1':'0';
    const dur=(d.end-d.start).toFixed(2);
    let cells=[`${d.start.toFixed(2)}s`,`${dur}s`,`<span class="cell-chord">${d.gt_chord}</span>`,`<span class="cell-chord ${d.match?'cell-match':'cell-mismatch'}">${d.pred_chord}</span>`];
    visComps.forEach(comp=>{
      const segs=compDiff[comp]||[];const mid=(d.start+d.end)/2;
      const seg=segs.find(s=>s.start<=mid&&mid<s.end);
      if(seg)cells.push(seg.match?`<span class="comp-pill comp-ok">${seg.gt_value}</span>`:`<span class="comp-pill comp-err">${seg.gt_value}\u2192${seg.pred_value}</span>`);
      else cells.push('-');
    });
    cells.forEach(html=>{const td=document.createElement('td');td.innerHTML=html;tr.appendChild(td);});
    tr.addEventListener('click',()=>scrollTimelineTo(d.start,d.end));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);wrap.appendChild(table);body.appendChild(wrap);container.appendChild(card);
}

function applyTableFilter(body){body.querySelectorAll('tbody tr').forEach(tr=>{tr.style.display=tableShowOnlyErrors&&tr.dataset.match==='1'?'none':'';});}

function sortTableEl(table,ci,asc){
  const tb=table.querySelector('tbody');const rows=Array.from(tb.querySelectorAll('tr'));
  rows.sort((a,b)=>{const at=a.children[ci]?.textContent||'',bt=b.children[ci]?.textContent||'';const an=parseFloat(at),bn=parseFloat(bt);if(!isNaN(an)&&!isNaN(bn))return asc?an-bn:bn-an;return asc?at.localeCompare(bt):bt.localeCompare(at);});
  rows.forEach(r=>tb.appendChild(r));
}

function scrollTimelineTo(start,end){
  const mid=(start+end)/2,span=20,nr=[mid-span/2,mid+span/2];
  allPlotIds.forEach(id=>{const el=document.getElementById(id);if(el)Plotly.relayout(el,{'xaxis.range[0]':nr[0],'xaxis.range[1]':nr[1]});});
}

// ── Decomposed Components ──

function addComponentView(container,data){
  const comps=COMP_NAMES.filter(c=>visibleComponents.has(c));
  if(comps.length===0)return;

  const yLabels=comps.slice().reverse();
  const traces=[];
  const maxT=Math.max(...Object.values(data.component_diff).flatMap(s=>s.map(x=>x.end)),1);

  comps.forEach(comp=>{
    const segments=data.component_diff[comp]||[];if(!segments.length)return;
    const isRB=comp==='root'||comp==='bass';
    traces.push({
      type:'bar',orientation:'h',
      y:segments.map(()=>comp), x:segments.map(s=>s.end-s.start), base:segments.map(s=>s.start),
      marker:{color:segments.map(s=>s.match?(isRB?(ROOT_COLORS[s.gt_value]||'#636e72'):MATCH_COLOR):MISMATCH_COLOR),line:{width:0.3,color:'#1a1d27'}},
      text:segments.map(s=>(s.end-s.start)<1?'':(s.match?s.gt_value:`${s.gt_value}\u2192${s.pred_value}`)),
      textposition:'inside',textfont:{size:9,color:'#fff'},
      hovertext:segments.map(s=>s.match?`${comp}: ${s.gt_value}<br>${s.start.toFixed(2)}s - ${s.end.toFixed(2)}s`:`${comp}: ${s.gt_value} \u2192 ${s.pred_value}<br>${s.start.toFixed(2)}s - ${s.end.toFixed(2)}s`),
      hoverinfo:'text',showlegend:false,
    });
  });

  const height=Math.max(comps.length*35,140);
  const layout={...PLB,height,barmode:'stack',xaxis:{...PLB.xaxis,range:[0,maxT],title:'Time (s)'},yaxis:{...PLB.yaxis,fixedrange:true,categoryorder:'array',categoryarray:yLabels}};

  const {card,body}=createCard('Decomposed Components (GT vs Pred)',{fullscreen:()=>openFullscreen('Decomposed Components',traces,{...layout,height:500})});
  const plotDiv=document.createElement('div');plotDiv.className='chart-plot';plotDiv.id='componentView';
  body.appendChild(plotDiv);container.appendChild(card);allPlotIds.push(plotDiv.id);
  Plotly.newPlot(plotDiv,traces,layout,PCFG);
  syncZoom();
}

// ── Interactions ──

function syncZoom(){
  if(allPlotIds.length<2)return;
  const primary=document.getElementById(allPlotIds[0]);if(!primary)return;
  primary.on('plotly_relayout',(ev)=>{
    const x0=ev['xaxis.range[0]'],x1=ev['xaxis.range[1]'];
    if(x0===undefined||x1===undefined)return;
    allPlotIds.slice(1).forEach(id=>{const el=document.getElementById(id);if(el)Plotly.relayout(el,{'xaxis.range[0]':x0,'xaxis.range[1]':x1});});
  });
}

function setupClickHandler(plotDiv,data){
  plotDiv.on('plotly_click',(ev)=>{
    if(!ev.points||!ev.points.length)return;
    const time=ev.points[0].x+(ev.points[0].base||0);
    const panel=document.getElementById('detailPanel');panel.classList.add('visible');
    document.getElementById('detailTime').textContent=`${time.toFixed(2)}s`;
    if(data.gt){const s=data.gt.segments.find(s=>s.start<=time&&time<s.end);document.getElementById('detailGT').textContent=s?s.chord:'-';}
    if(data.pred){const s=data.pred.segments.find(s=>s.start<=time&&time<s.end);document.getElementById('detailPred').textContent=s?s.chord:'-';}
  });
}

document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'){closeFullscreen();return;}
  if(!currentTrackData||!currentTrackData.diff)return;
  if(e.target.tagName==='INPUT')return;
  const mm=currentTrackData.diff.filter(d=>!d.match);if(!mm.length)return;
  const plotEl=document.getElementById('chordTimeline');if(!plotEl||!plotEl.layout)return;
  const range=plotEl.layout.xaxis.range,center=(range[0]+range[1])/2;
  let target=null;
  if(e.key==='ArrowRight'||e.key==='n')target=mm.find(m=>m.start>center)||mm[0];
  else if(e.key==='ArrowLeft'||e.key==='p')target=[...mm].reverse().find(m=>m.end<center)||mm[mm.length-1];
  else return;
  if(target)scrollTimelineTo(target.start,target.end);
});

init();
</script>
