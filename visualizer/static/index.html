<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChordMax Visualizer</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242834;
    --border: #2e3345;
    --text: #e1e4ed;
    --text-muted: #8b90a0;
    --accent: #6c8cff;
    --match: #2dd4a0;
    --mismatch: #f0536a;
    --sidebar-w: 300px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  .sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-header h1 {
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .sidebar-header select, .sidebar-header input {
    width: 100%;
    padding: 8px 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    margin-bottom: 8px;
    outline: none;
  }

  .sidebar-header select:focus, .sidebar-header input:focus {
    border-color: var(--accent);
  }

  .track-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }

  .track-item {
    padding: 8px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    transition: background 0.15s;
    border-left: 3px solid transparent;
  }

  .track-item:hover { background: var(--surface2); }
  .track-item.active { background: var(--surface2); border-left-color: var(--accent); }

  .track-badge {
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    font-weight: 600;
  }

  .badge-gt { background: #1a3a2a; color: var(--match); }
  .badge-pred { background: #3a1a2a; color: var(--mismatch); }
  .badge-both { background: #1a2a3a; color: var(--accent); }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .toolbar {
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 13px;
    flex-wrap: wrap;
  }

  .toolbar .track-title {
    font-weight: 600;
    font-size: 15px;
    color: var(--text);
  }

  .toolbar .match-badge {
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }

  .toggle-group {
    display: flex;
    gap: 4px;
    margin-left: auto;
  }

  .toggle-btn {
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 11px;
    transition: all 0.15s;
  }

  .toggle-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .charts-container {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .chart-card h3 {
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .chart-plot { width: 100%; }

  .empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 15px;
    flex-direction: column;
    gap: 8px;
  }

  .empty-state .hint { font-size: 13px; opacity: 0.6; }

  /* ── Chord comparison table ── */

  .table-controls {
    padding: 8px 14px;
    display: flex;
    gap: 8px;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }

  .table-filter-btn {
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 11px;
  }

  .table-filter-btn.active {
    background: var(--mismatch);
    color: #fff;
    border-color: var(--mismatch);
  }

  .table-wrap {
    max-height: 400px;
    overflow-y: auto;
  }

  .chord-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  .chord-table th {
    position: sticky;
    top: 0;
    background: var(--surface2);
    padding: 6px 10px;
    text-align: left;
    font-weight: 600;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }

  .chord-table th:hover { color: var(--text); }
  .chord-table th .sort-arrow { margin-left: 4px; font-size: 9px; }

  .chord-table td {
    padding: 5px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  .chord-table tr { cursor: pointer; transition: background 0.1s; }
  .chord-table tbody tr:hover { background: var(--surface2); }

  .chord-table tr.row-match td:first-child { border-left: 3px solid var(--match); }
  .chord-table tr.row-mismatch td:first-child { border-left: 3px solid var(--mismatch); }

  .cell-match { color: var(--match); }
  .cell-mismatch { color: var(--mismatch); font-weight: 600; }
  .cell-chord { font-family: 'JetBrains Mono', 'Fira Code', monospace; }

  .comp-pill {
    display: inline-block;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 10px;
    margin: 0 1px;
  }

  .comp-ok { background: #1a3a2a; color: var(--match); }
  .comp-err { background: #3a1a1a; color: var(--mismatch); }

  .detail-panel {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    font-size: 13px;
    display: none;
  }

  .detail-panel.visible { display: flex; gap: 24px; flex-wrap: wrap; }

  .detail-item { display: flex; gap: 6px; }
  .detail-label { color: var(--text-muted); }
  .detail-value { font-weight: 600; }

  .track-list::-webkit-scrollbar,
  .charts-container::-webkit-scrollbar,
  .table-wrap::-webkit-scrollbar {
    width: 6px;
  }

  .track-list::-webkit-scrollbar-thumb,
  .charts-container::-webkit-scrollbar-thumb,
  .table-wrap::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h1>ChordMax Visualizer</h1>
    <select id="datasetSelect">
      <option value="">Select dataset...</option>
    </select>
    <select id="inferenceSelect">
      <option value="">Select inference directory...</option>
    </select>
    <input type="text" id="searchInput" placeholder="Search tracks...">
    <div id="datasetInfo" style="font-size:11px;color:var(--text-muted);margin-top:4px;display:none"></div>
  </div>
  <div class="track-list" id="trackList"></div>
</div>

<div class="main">
  <div class="toolbar" id="toolbar" style="display:none">
    <span class="track-title" id="trackTitle"></span>
    <span class="match-badge" id="matchBadge"></span>
    <div class="toggle-group" id="componentToggles"></div>
  </div>

  <div class="charts-container" id="chartsContainer">
    <div class="empty-state" id="emptyState">
      <span>Select a track to visualize</span>
      <span class="hint">Choose a dataset and inference directory, then click a track</span>
    </div>
  </div>

  <div class="detail-panel" id="detailPanel">
    <div class="detail-item">
      <span class="detail-label">Time:</span>
      <span class="detail-value" id="detailTime">-</span>
    </div>
    <div class="detail-item">
      <span class="detail-label">GT:</span>
      <span class="detail-value" id="detailGT">-</span>
    </div>
    <div class="detail-item">
      <span class="detail-label">Pred:</span>
      <span class="detail-value" id="detailPred">-</span>
    </div>
  </div>
</div>

<script>
const ROOT_COLORS = {
  'C': '#e74c3c', 'C#': '#e67e22', 'D': '#f1c40f', 'D#': '#2ecc71',
  'E': '#1abc9c', 'F': '#3498db', 'F#': '#6c5ce7', 'G': '#9b59b6',
  'G#': '#e84393', 'A': '#fd79a8', 'A#': '#fdcb6e', 'B': '#00cec9',
  'N': '#636e72',
};

const MATCH_COLOR = 'rgba(45,212,160,0.6)';
const MISMATCH_COLOR = 'rgba(240,83,106,0.6)';
const COMPONENT_NAMES = ['root', 'bass', 'triad', 'misc', '6th', '7th', '9th', '11th', '13th'];

const PLOTLY_LAYOUT_BASE = {
  paper_bgcolor: '#1a1d27',
  plot_bgcolor: '#1a1d27',
  font: { color: '#e1e4ed', size: 11 },
  margin: { l: 80, r: 20, t: 10, b: 30 },
  xaxis: { gridcolor: '#2e3345', zerolinecolor: '#2e3345', title: '' },
  yaxis: { gridcolor: '#2e3345', zerolinecolor: '#2e3345' },
  showlegend: false,
  hovermode: 'closest',
};

const PLOTLY_CONFIG = {
  displayModeBar: true,
  modeBarButtonsToRemove: ['lasso2d', 'select2d', 'autoScale2d'],
  displaylogo: false,
  responsive: true,
};

let currentTrackData = null;
let currentTrackId = null;
let currentGtDir = null;
let currentDataset = null;
let allDatasets = [];
let visibleComponents = new Set(COMPONENT_NAMES);
let allPlotIds = [];
let tableShowOnlyErrors = false;

// ── API ──

async function fetchJSON(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
  return resp.json();
}

// ── Init ──

async function init() {
  await fetchJSON('/api/config');
  await loadDatasets();
  await loadInferenceDirs();

  document.getElementById('datasetSelect').addEventListener('change', async (e) => {
    currentDataset = e.target.value || null;
    updateDatasetInfo();
    await loadTracks();
  });

  document.getElementById('inferenceSelect').addEventListener('change', async () => {
    await loadTracks();
    if (currentTrackId) await reselectCurrentTrack();
  });

  document.getElementById('searchInput').addEventListener('input', filterTracks);

  if (allDatasets.length > 0) {
    document.getElementById('datasetSelect').value = allDatasets[0].name;
    currentDataset = allDatasets[0].name;
    updateDatasetInfo();
    await loadTracks();
  }
}

async function loadDatasets() {
  try {
    allDatasets = await fetchJSON('/api/datasets');
    const sel = document.getElementById('datasetSelect');
    allDatasets.forEach(ds => {
      const opt = document.createElement('option');
      opt.value = ds.name;
      opt.textContent = `${ds.name} (${ds.track_count} tracks)`;
      sel.appendChild(opt);
    });
  } catch (e) { console.warn('Could not load datasets:', e); }
}

function updateDatasetInfo() {
  const el = document.getElementById('datasetInfo');
  if (!currentDataset) { el.style.display = 'none'; return; }
  const ds = allDatasets.find(d => d.name === currentDataset);
  if (!ds) { el.style.display = 'none'; return; }
  const durMin = (ds.total_duration_s / 60).toFixed(1);
  el.innerHTML = `${ds.track_count} tracks &middot; ${durMin} min &middot; ${ds.unique_chords} unique chords`;
  el.style.display = 'block';
}

async function loadInferenceDirs() {
  try {
    const dirs = await fetchJSON('/api/inference_dirs');
    const sel = document.getElementById('inferenceSelect');
    dirs.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.path;
      opt.textContent = `${d.name} (${d.track_count} tracks)`;
      sel.appendChild(opt);
    });
  } catch (e) { console.warn('Could not load inference dirs:', e); }
}

async function loadTracks() {
  const params = new URLSearchParams();
  if (currentDataset) params.set('dataset', currentDataset);
  const predDir = document.getElementById('inferenceSelect').value;
  if (predDir) params.set('pred_dir', predDir);

  try {
    const tracks = await fetchJSON(`/api/tracks?${params}`);
    renderTrackList(tracks);
  } catch (e) { console.warn('Could not load tracks:', e); }
}

function renderTrackList(tracks) {
  const list = document.getElementById('trackList');
  list.innerHTML = '';
  tracks.forEach(t => {
    const el = document.createElement('div');
    el.className = 'track-item';
    if (t.track_id === currentTrackId) el.classList.add('active');
    el.dataset.trackId = t.track_id;
    if (t.gt_dir) el.dataset.gtDir = t.gt_dir;

    let badge = '';
    if (t.has_gt && t.has_pred) badge = '<span class="track-badge badge-both">GT+Pred</span>';
    else if (t.has_gt) badge = '<span class="track-badge badge-gt">GT</span>';
    else badge = '<span class="track-badge badge-pred">Pred</span>';

    el.innerHTML = `<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.track_id}</span>${badge}`;
    el.addEventListener('click', () => selectTrack(t.track_id, el));
    list.appendChild(el);
  });
}

function filterTracks() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('.track-item').forEach(el => {
    el.style.display = el.dataset.trackId.toLowerCase().includes(q) ? '' : 'none';
  });
}

// ── Track selection ──

async function reselectCurrentTrack() {
  if (!currentTrackId) return;
  const el = document.querySelector(`.track-item[data-track-id="${currentTrackId}"]`);
  if (el) await selectTrack(currentTrackId, el);
}

async function selectTrack(trackId, el) {
  document.querySelectorAll('.track-item.active').forEach(e => e.classList.remove('active'));
  if (el) el.classList.add('active');

  currentTrackId = trackId;
  currentGtDir = el?.dataset?.gtDir || null;

  const params = new URLSearchParams();
  if (currentDataset) params.set('dataset', currentDataset);
  const selVal = document.getElementById('inferenceSelect').value;
  if (selVal) params.set('pred_dir', selVal);
  if (currentGtDir) params.set('gt_dir', currentGtDir);

  try {
    const data = await fetchJSON(`/api/track/${trackId}?${params}`);
    currentTrackData = data;
    renderVisualization(data);
  } catch (e) {
    console.error('Error loading track:', e);
  }
}

// ── Rendering ──

function renderVisualization(data) {
  document.getElementById('toolbar').style.display = 'flex';
  document.getElementById('trackTitle').textContent = data.track_id;

  const badge = document.getElementById('matchBadge');
  if (data.match_ratio !== undefined) {
    const pct = (data.match_ratio * 100).toFixed(1);
    badge.textContent = `${pct}% match`;
    badge.style.background = data.match_ratio > 0.7 ? '#1a3a2a' : '#3a1a1a';
    badge.style.color = data.match_ratio > 0.7 ? '#2dd4a0' : '#f0536a';
  } else {
    badge.textContent = '';
  }

  renderComponentToggles();

  const container = document.getElementById('chartsContainer');
  container.innerHTML = '';
  allPlotIds = [];

  if (data.gt || data.pred) addChordTimeline(container, data);
  if (data.diff) addDiffTimeline(container, data);
  if (data.diff) addChordTable(container, data);
  if (data.component_diff) addComponentView(container, data);
}

function renderComponentToggles() {
  const group = document.getElementById('componentToggles');
  group.innerHTML = '';
  COMPONENT_NAMES.forEach(comp => {
    const btn = document.createElement('button');
    btn.className = `toggle-btn ${visibleComponents.has(comp) ? 'active' : ''}`;
    btn.textContent = comp;
    btn.addEventListener('click', () => {
      visibleComponents.has(comp) ? visibleComponents.delete(comp) : visibleComponents.add(comp);
      btn.classList.toggle('active');
      if (currentTrackData) renderVisualization(currentTrackData);
    });
    group.appendChild(btn);
  });
}

// ── Chord Timeline ──

function chordColor(chord) {
  if (!chord || chord === 'N' || chord === 'X') return ROOT_COLORS['N'];
  return ROOT_COLORS[chord.split(':')[0]] || ROOT_COLORS['N'];
}

function addChordTimeline(container, data) {
  const card = document.createElement('div');
  card.className = 'chart-card';
  card.innerHTML = '<h3>Chord Timeline</h3>';
  const plotDiv = document.createElement('div');
  plotDiv.className = 'chart-plot';
  plotDiv.id = 'chordTimeline';
  card.appendChild(plotDiv);
  container.appendChild(card);
  allPlotIds.push(plotDiv.id);

  const traces = [];
  const maxTime = Math.max(
    ...(data.gt?.segments || []).map(s => s.end),
    ...(data.pred?.segments || []).map(s => s.end), 1
  );

  if (data.gt) {
    traces.push({
      type: 'bar',
      orientation: 'h',
      y: data.gt.segments.map(() => 'GT'),
      x: data.gt.segments.map(s => s.end - s.start),
      base: data.gt.segments.map(s => s.start),
      marker: { color: data.gt.segments.map(s => chordColor(s.chord)), line: { width: 0.5, color: '#1a1d27' } },
      text: data.gt.segments.map(s => s.chord),
      textposition: 'inside',
      textfont: { size: 10, color: '#fff' },
      hovertext: data.gt.segments.map(s => `${s.chord}<br>${s.start.toFixed(2)}s - ${s.end.toFixed(2)}s`),
      hoverinfo: 'text',
    });
  }

  if (data.pred) {
    traces.push({
      type: 'bar',
      orientation: 'h',
      y: data.pred.segments.map(() => 'Pred'),
      x: data.pred.segments.map(s => s.end - s.start),
      base: data.pred.segments.map(s => s.start),
      marker: { color: data.pred.segments.map(s => chordColor(s.chord)), line: { width: 0.5, color: '#1a1d27' } },
      text: data.pred.segments.map(s => s.chord),
      textposition: 'inside',
      textfont: { size: 10, color: '#fff' },
      hovertext: data.pred.segments.map(s => `${s.chord}<br>${s.start.toFixed(2)}s - ${s.end.toFixed(2)}s`),
      hoverinfo: 'text',
    });
  }

  const layout = {
    ...PLOTLY_LAYOUT_BASE,
    height: 130,
    barmode: 'stack',
    xaxis: { ...PLOTLY_LAYOUT_BASE.xaxis, range: [0, maxTime], title: 'Time (s)' },
    yaxis: { ...PLOTLY_LAYOUT_BASE.yaxis, fixedrange: true, autorange: 'reversed' },
  };

  Plotly.newPlot(plotDiv, traces, layout, PLOTLY_CONFIG);
  setupClickHandler(plotDiv, data);
}

// ── Diff Timeline ──

function addDiffTimeline(container, data) {
  const card = document.createElement('div');
  card.className = 'chart-card';
  card.innerHTML = '<h3>Match / Mismatch</h3>';
  const plotDiv = document.createElement('div');
  plotDiv.className = 'chart-plot';
  plotDiv.id = 'diffTimeline';
  card.appendChild(plotDiv);
  container.appendChild(card);
  allPlotIds.push(plotDiv.id);

  const maxTime = Math.max(...data.diff.map(d => d.end), 1);

  const trace = {
    type: 'bar',
    orientation: 'h',
    y: data.diff.map(() => 'Diff'),
    x: data.diff.map(d => d.end - d.start),
    base: data.diff.map(d => d.start),
    marker: { color: data.diff.map(d => d.match ? MATCH_COLOR : MISMATCH_COLOR), line: { width: 0.3, color: '#1a1d27' } },
    text: data.diff.map(d => d.match ? '' : `${d.gt_chord} \u2192 ${d.pred_chord}`),
    textposition: 'inside',
    textfont: { size: 9, color: '#fff' },
    hovertext: data.diff.map(d =>
      d.match
        ? `${d.gt_chord} (match)<br>${d.start.toFixed(2)}s - ${d.end.toFixed(2)}s`
        : `GT: ${d.gt_chord}<br>Pred: ${d.pred_chord}<br>${d.start.toFixed(2)}s - ${d.end.toFixed(2)}s`
    ),
    hoverinfo: 'text',
  };

  const layout = {
    ...PLOTLY_LAYOUT_BASE,
    height: 70,
    xaxis: { ...PLOTLY_LAYOUT_BASE.xaxis, range: [0, maxTime] },
    yaxis: { ...PLOTLY_LAYOUT_BASE.yaxis, fixedrange: true },
  };

  Plotly.newPlot(plotDiv, [trace], layout, PLOTLY_CONFIG);
}

// ── Chord Comparison Table ──

function addChordTable(container, data) {
  const card = document.createElement('div');
  card.className = 'chart-card';
  card.innerHTML = '<h3>Segment Comparison (GT vs Pred)</h3>';

  const controls = document.createElement('div');
  controls.className = 'table-controls';
  const filterBtn = document.createElement('button');
  filterBtn.className = 'table-filter-btn';
  filterBtn.textContent = 'Show only errors';
  filterBtn.addEventListener('click', () => {
    tableShowOnlyErrors = !tableShowOnlyErrors;
    filterBtn.classList.toggle('active', tableShowOnlyErrors);
    applyTableFilter(card);
  });
  const countInfo = document.createElement('span');
  countInfo.style.cssText = 'font-size:11px;color:var(--text-muted);margin-left:auto';
  const errors = data.diff.filter(d => !d.match).length;
  const total = data.diff.length;
  countInfo.textContent = `${errors} errors / ${total} segments`;
  controls.appendChild(filterBtn);
  controls.appendChild(countInfo);
  card.appendChild(controls);

  const wrap = document.createElement('div');
  wrap.className = 'table-wrap';

  const table = document.createElement('table');
  table.className = 'chord-table';

  const visComps = COMPONENT_NAMES.filter(c => visibleComponents.has(c));

  const thead = document.createElement('thead');
  const headerRow = document.createElement('tr');
  const headers = ['Time', 'Duration', 'GT Chord', 'Pred Chord', ...visComps.map(c => c)];
  let sortCol = -1, sortAsc = true;

  headers.forEach((h, i) => {
    const th = document.createElement('th');
    th.innerHTML = h + '<span class="sort-arrow"></span>';
    th.addEventListener('click', () => {
      if (sortCol === i) sortAsc = !sortAsc;
      else { sortCol = i; sortAsc = true; }
      sortTable(table, sortCol, sortAsc);
      thead.querySelectorAll('.sort-arrow').forEach(s => s.textContent = '');
      th.querySelector('.sort-arrow').textContent = sortAsc ? ' \u25B2' : ' \u25BC';
    });
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');

  const gtDecomp = data.gt?.decomposed || {};
  const predDecomp = data.pred?.decomposed || {};

  data.diff.forEach((d, idx) => {
    const tr = document.createElement('tr');
    tr.className = d.match ? 'row-match' : 'row-mismatch';
    tr.dataset.match = d.match ? '1' : '0';

    const dur = (d.end - d.start).toFixed(2);

    const cells = [
      `${d.start.toFixed(2)}s`,
      `${dur}s`,
      `<span class="cell-chord">${d.gt_chord}</span>`,
      `<span class="cell-chord ${d.match ? 'cell-match' : 'cell-mismatch'}">${d.pred_chord}</span>`,
    ];

    const compDiff = data.component_diff || {};
    visComps.forEach(comp => {
      const compSegs = compDiff[comp] || [];
      const mid = (d.start + d.end) / 2;
      const seg = compSegs.find(s => s.start <= mid && mid < s.end);
      if (seg) {
        if (seg.match) {
          cells.push(`<span class="comp-pill comp-ok">${seg.gt_value}</span>`);
        } else {
          cells.push(`<span class="comp-pill comp-err">${seg.gt_value}\u2192${seg.pred_value}</span>`);
        }
      } else {
        cells.push('-');
      }
    });

    cells.forEach(html => {
      const td = document.createElement('td');
      td.innerHTML = html;
      tr.appendChild(td);
    });

    tr.addEventListener('click', () => scrollTimelineTo(d.start, d.end));
    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  wrap.appendChild(table);
  card.appendChild(wrap);
  container.appendChild(card);
}

function applyTableFilter(card) {
  const rows = card.querySelectorAll('tbody tr');
  rows.forEach(tr => {
    if (tableShowOnlyErrors) {
      tr.style.display = tr.dataset.match === '1' ? 'none' : '';
    } else {
      tr.style.display = '';
    }
  });
}

function sortTable(table, colIdx, asc) {
  const tbody = table.querySelector('tbody');
  const rows = Array.from(tbody.querySelectorAll('tr'));
  rows.sort((a, b) => {
    const aText = a.children[colIdx]?.textContent || '';
    const bText = b.children[colIdx]?.textContent || '';
    const aNum = parseFloat(aText);
    const bNum = parseFloat(bText);
    if (!isNaN(aNum) && !isNaN(bNum)) return asc ? aNum - bNum : bNum - aNum;
    return asc ? aText.localeCompare(bText) : bText.localeCompare(aText);
  });
  rows.forEach(r => tbody.appendChild(r));
}

function scrollTimelineTo(start, end) {
  const mid = (start + end) / 2;
  const span = 20;
  const newRange = [mid - span / 2, mid + span / 2];
  allPlotIds.forEach(id => {
    const el = document.getElementById(id);
    if (el) Plotly.relayout(el, { 'xaxis.range[0]': newRange[0], 'xaxis.range[1]': newRange[1] });
  });
}

// ── Decomposed Components ──

function addComponentView(container, data) {
  const card = document.createElement('div');
  card.className = 'chart-card';
  card.innerHTML = '<h3>Decomposed Components (GT vs Pred)</h3>';
  const plotDiv = document.createElement('div');
  plotDiv.className = 'chart-plot';
  plotDiv.id = 'componentView';
  card.appendChild(plotDiv);
  container.appendChild(card);
  allPlotIds.push(plotDiv.id);

  const comps = COMPONENT_NAMES.filter(c => visibleComponents.has(c));
  if (comps.length === 0) return;

  const yLabels = comps.slice().reverse();
  const traces = [];
  const maxTime = Math.max(
    ...Object.values(data.component_diff).flatMap(segs => segs.map(s => s.end)), 1
  );

  comps.forEach(comp => {
    const segments = data.component_diff[comp] || [];
    if (segments.length === 0) return;

    const isRootOrBass = comp === 'root' || comp === 'bass';

    traces.push({
      type: 'bar',
      orientation: 'h',
      y: segments.map(() => comp),
      x: segments.map(s => s.end - s.start),
      base: segments.map(s => s.start),
      marker: {
        color: segments.map(s => {
          if (s.match) {
            return isRootOrBass ? (ROOT_COLORS[s.gt_value] || '#636e72') : MATCH_COLOR;
          }
          return MISMATCH_COLOR;
        }),
        line: { width: 0.3, color: '#1a1d27' },
      },
      text: segments.map(s => {
        if (s.end - s.start < 1.0) return '';
        return s.match ? s.gt_value : `${s.gt_value}\u2192${s.pred_value}`;
      }),
      textposition: 'inside',
      textfont: { size: 9, color: '#fff' },
      hovertext: segments.map(s =>
        s.match
          ? `${comp}: ${s.gt_value}<br>${s.start.toFixed(2)}s - ${s.end.toFixed(2)}s`
          : `${comp}: ${s.gt_value} \u2192 ${s.pred_value}<br>${s.start.toFixed(2)}s - ${s.end.toFixed(2)}s`
      ),
      hoverinfo: 'text',
      showlegend: false,
    });
  });

  const height = Math.max(comps.length * 35, 140);

  const layout = {
    ...PLOTLY_LAYOUT_BASE,
    height,
    barmode: 'stack',
    xaxis: { ...PLOTLY_LAYOUT_BASE.xaxis, range: [0, maxTime], title: 'Time (s)' },
    yaxis: {
      ...PLOTLY_LAYOUT_BASE.yaxis,
      fixedrange: true,
      categoryorder: 'array',
      categoryarray: yLabels,
    },
  };

  Plotly.newPlot(plotDiv, traces, layout, PLOTLY_CONFIG);
  syncZoom();
}

// ── Interactions ──

function syncZoom() {
  if (allPlotIds.length < 2) return;
  const primary = document.getElementById(allPlotIds[0]);
  if (!primary) return;

  primary.on('plotly_relayout', (ev) => {
    const x0 = ev['xaxis.range[0]'];
    const x1 = ev['xaxis.range[1]'];
    if (x0 === undefined || x1 === undefined) return;
    allPlotIds.slice(1).forEach(id => {
      const el = document.getElementById(id);
      if (el) Plotly.relayout(el, { 'xaxis.range[0]': x0, 'xaxis.range[1]': x1 });
    });
  });
}

function setupClickHandler(plotDiv, data) {
  plotDiv.on('plotly_click', (ev) => {
    if (!ev.points || ev.points.length === 0) return;
    const time = ev.points[0].x + (ev.points[0].base || 0);
    const panel = document.getElementById('detailPanel');
    panel.classList.add('visible');
    document.getElementById('detailTime').textContent = `${time.toFixed(2)}s`;
    if (data.gt) {
      const seg = data.gt.segments.find(s => s.start <= time && time < s.end);
      document.getElementById('detailGT').textContent = seg ? seg.chord : '-';
    }
    if (data.pred) {
      const seg = data.pred.segments.find(s => s.start <= time && time < s.end);
      document.getElementById('detailPred').textContent = seg ? seg.chord : '-';
    }
  });
}

// ── Keyboard navigation ──

document.addEventListener('keydown', (e) => {
  if (!currentTrackData || !currentTrackData.diff) return;
  if (e.target.tagName === 'INPUT') return;

  const mismatches = currentTrackData.diff.filter(d => !d.match);
  if (mismatches.length === 0) return;

  const plotEl = document.getElementById('chordTimeline');
  if (!plotEl || !plotEl.layout) return;

  const range = plotEl.layout.xaxis.range;
  const center = (range[0] + range[1]) / 2;
  let target = null;

  if (e.key === 'ArrowRight' || e.key === 'n') {
    target = mismatches.find(m => m.start > center) || mismatches[0];
  } else if (e.key === 'ArrowLeft' || e.key === 'p') {
    target = [...mismatches].reverse().find(m => m.end < center) || mismatches[mismatches.length - 1];
  } else {
    return;
  }

  if (target) scrollTimelineTo(target.start, target.end);
});

init();
</script>
