<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChordMax Visualizer</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242834;
    --border: #2e3345;
    --text: #e1e4ed;
    --text-muted: #8b90a0;
    --accent: #6c8cff;
    --match: #2dd4a0;
    --mismatch: #f0536a;
    --sidebar-w: 300px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  .sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-header h1 {
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .sidebar-header select, .sidebar-header input {
    width: 100%;
    padding: 8px 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    margin-bottom: 8px;
    outline: none;
  }

  .sidebar-header select:focus, .sidebar-header input:focus {
    border-color: var(--accent);
  }

  .track-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }

  .track-item {
    padding: 8px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    transition: background 0.15s;
    border-left: 3px solid transparent;
  }

  .track-item:hover { background: var(--surface2); }
  .track-item.active { background: var(--surface2); border-left-color: var(--accent); }

  .track-badge {
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    font-weight: 600;
  }

  .badge-gt { background: #1a3a2a; color: var(--match); }
  .badge-pred { background: #3a1a2a; color: var(--mismatch); }
  .badge-both { background: #1a2a3a; color: var(--accent); }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .toolbar {
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 13px;
    flex-wrap: wrap;
  }

  .toolbar .track-title {
    font-weight: 600;
    font-size: 15px;
    color: var(--text);
  }

  .toolbar .match-badge {
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }

  .toggle-group {
    display: flex;
    gap: 4px;
    margin-left: auto;
  }

  .toggle-btn {
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 11px;
    transition: all 0.15s;
  }

  .toggle-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .charts-container {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .chart-card h3 {
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .chart-plot {
    width: 100%;
  }

  .empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 15px;
    flex-direction: column;
    gap: 8px;
  }

  .empty-state .hint { font-size: 13px; opacity: 0.6; }

  .detail-panel {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    font-size: 13px;
    display: none;
  }

  .detail-panel.visible { display: flex; gap: 24px; flex-wrap: wrap; }

  .detail-item { display: flex; gap: 6px; }
  .detail-label { color: var(--text-muted); }
  .detail-value { font-weight: 600; }

  .track-list::-webkit-scrollbar,
  .charts-container::-webkit-scrollbar {
    width: 6px;
  }

  .track-list::-webkit-scrollbar-thumb,
  .charts-container::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h1>ChordMax Visualizer</h1>
    <select id="inferenceSelect">
      <option value="">Select inference directory...</option>
    </select>
    <input type="text" id="searchInput" placeholder="Search tracks...">
  </div>
  <div class="track-list" id="trackList"></div>
</div>

<div class="main">
  <div class="toolbar" id="toolbar" style="display:none">
    <span class="track-title" id="trackTitle"></span>
    <span class="match-badge" id="matchBadge"></span>
    <div class="toggle-group" id="componentToggles"></div>
  </div>

  <div class="charts-container" id="chartsContainer">
    <div class="empty-state" id="emptyState">
      <span>Select a track to visualize</span>
      <span class="hint">Choose an inference directory, then click a track</span>
    </div>
  </div>

  <div class="detail-panel" id="detailPanel">
    <div class="detail-item">
      <span class="detail-label">Time:</span>
      <span class="detail-value" id="detailTime">-</span>
    </div>
    <div class="detail-item">
      <span class="detail-label">GT:</span>
      <span class="detail-value" id="detailGT">-</span>
    </div>
    <div class="detail-item">
      <span class="detail-label">Pred:</span>
      <span class="detail-value" id="detailPred">-</span>
    </div>
  </div>
</div>

<script>
const ROOT_COLORS = {
  'C': '#e74c3c', 'C#': '#e67e22', 'D': '#f1c40f', 'D#': '#2ecc71',
  'E': '#1abc9c', 'F': '#3498db', 'F#': '#6c5ce7', 'G': '#9b59b6',
  'G#': '#e84393', 'A': '#fd79a8', 'A#': '#fdcb6e', 'B': '#00cec9',
  'N': '#636e72',
};

const TRIAD_COLORS = {
  'maj': '#3498db', 'min': '#e74c3c', 'dim': '#9b59b6', 'aug': '#e67e22',
  'sus2': '#1abc9c', 'sus4': '#2ecc71', 'N': '#636e72', '5': '#fdcb6e',
};

const MATCH_COLOR = 'rgba(45,212,160,0.6)';
const MISMATCH_COLOR = 'rgba(240,83,106,0.6)';

const PLOTLY_LAYOUT_BASE = {
  paper_bgcolor: '#1a1d27',
  plot_bgcolor: '#1a1d27',
  font: { color: '#e1e4ed', size: 11 },
  margin: { l: 80, r: 20, t: 10, b: 30 },
  xaxis: {
    gridcolor: '#2e3345',
    zerolinecolor: '#2e3345',
    title: '',
  },
  yaxis: {
    gridcolor: '#2e3345',
    zerolinecolor: '#2e3345',
  },
  showlegend: false,
  hovermode: 'closest',
};

const PLOTLY_CONFIG = {
  displayModeBar: true,
  modeBarButtonsToRemove: ['lasso2d', 'select2d', 'autoScale2d'],
  displaylogo: false,
  responsive: true,
};

let currentTrackData = null;
let visibleComponents = new Set([
  'root', 'bass', 'triad', 'misc', '6th', '7th', '9th', '11th', '13th'
]);
let allPlotIds = [];

// ── API helpers ──

async function fetchJSON(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
  return resp.json();
}

// ── Initialization ──

async function init() {
  const config = await fetchJSON('/api/config');
  await loadInferenceDirs();
  await loadTracks();

  document.getElementById('inferenceSelect').addEventListener('change', async (e) => {
    const dir = e.target.value;
    if (dir) {
      await loadTracks(null, dir);
    }
  });

  document.getElementById('searchInput').addEventListener('input', filterTracks);
}

async function loadInferenceDirs() {
  try {
    const dirs = await fetchJSON('/api/inference_dirs');
    const sel = document.getElementById('inferenceSelect');
    dirs.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.path;
      opt.textContent = `${d.name} (${d.track_count} tracks)`;
      sel.appendChild(opt);
    });
  } catch (e) {
    console.warn('Could not load inference dirs:', e);
  }
}

async function loadTracks(gtDir, predDir) {
  const params = new URLSearchParams();
  if (gtDir) params.set('gt_dir', gtDir);
  if (predDir) params.set('pred_dir', predDir);

  try {
    const tracks = await fetchJSON(`/api/tracks?${params}`);
    renderTrackList(tracks);
  } catch (e) {
    console.warn('Could not load tracks:', e);
  }
}

function renderTrackList(tracks) {
  const list = document.getElementById('trackList');
  list.innerHTML = '';
  tracks.forEach(t => {
    const el = document.createElement('div');
    el.className = 'track-item';
    el.dataset.trackId = t.track_id;

    let badge = '';
    if (t.has_gt && t.has_pred) {
      badge = '<span class="track-badge badge-both">GT+Pred</span>';
    } else if (t.has_gt) {
      badge = '<span class="track-badge badge-gt">GT</span>';
    } else {
      badge = '<span class="track-badge badge-pred">Pred</span>';
    }

    el.innerHTML = `<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.track_id}</span>${badge}`;
    el.addEventListener('click', () => selectTrack(t.track_id, el));
    list.appendChild(el);
  });
}

function filterTracks() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('.track-item').forEach(el => {
    el.style.display = el.dataset.trackId.toLowerCase().includes(q) ? '' : 'none';
  });
}

// ── Track selection ──

async function selectTrack(trackId, el) {
  document.querySelectorAll('.track-item.active').forEach(e => e.classList.remove('active'));
  if (el) el.classList.add('active');

  const params = new URLSearchParams();
  const selVal = document.getElementById('inferenceSelect').value;
  if (selVal) params.set('pred_dir', selVal);

  try {
    const data = await fetchJSON(`/api/track/${trackId}?${params}`);
    currentTrackData = data;
    renderVisualization(data);
  } catch (e) {
    console.error('Error loading track:', e);
  }
}

// ── Rendering ──

function renderVisualization(data) {
  const toolbar = document.getElementById('toolbar');
  toolbar.style.display = 'flex';

  document.getElementById('trackTitle').textContent = data.track_id;

  const badge = document.getElementById('matchBadge');
  if (data.match_ratio !== undefined) {
    const pct = (data.match_ratio * 100).toFixed(1);
    badge.textContent = `${pct}% match`;
    badge.style.background = data.match_ratio > 0.7 ? '#1a3a2a' : '#3a1a1a';
    badge.style.color = data.match_ratio > 0.7 ? '#2dd4a0' : '#f0536a';
  } else {
    badge.textContent = '';
  }

  renderComponentToggles();

  const container = document.getElementById('chartsContainer');
  container.innerHTML = '';
  allPlotIds = [];

  document.getElementById('emptyState')?.remove();

  if (data.gt || data.pred) {
    addChordTimeline(container, data);
  }

  if (data.diff) {
    addDiffTimeline(container, data);
  }

  if (data.component_diff) {
    addComponentView(container, data);
  }
}

function renderComponentToggles() {
  const group = document.getElementById('componentToggles');
  group.innerHTML = '';

  const comps = ['root', 'bass', 'triad', 'misc', '6th', '7th', '9th', '11th', '13th'];
  comps.forEach(comp => {
    const btn = document.createElement('button');
    btn.className = `toggle-btn ${visibleComponents.has(comp) ? 'active' : ''}`;
    btn.textContent = comp;
    btn.addEventListener('click', () => {
      if (visibleComponents.has(comp)) {
        visibleComponents.delete(comp);
        btn.classList.remove('active');
      } else {
        visibleComponents.add(comp);
        btn.classList.add('active');
      }
      if (currentTrackData) renderVisualization(currentTrackData);
    });
    group.appendChild(btn);
  });
}

// ── Chart builders ──

function makeShapes(segments, y0, y1, colorFn) {
  return segments.map(seg => ({
    type: 'rect',
    x0: seg.start, x1: seg.end,
    y0, y1,
    fillcolor: colorFn(seg),
    line: { width: 0.5, color: '#1a1d27' },
    layer: 'below',
  }));
}

function makeAnnotations(segments, y, labelFn) {
  const minDuration = 0.5;
  return segments
    .filter(seg => (seg.end - seg.start) >= minDuration)
    .map(seg => ({
      x: (seg.start + seg.end) / 2,
      y: y,
      text: labelFn(seg),
      showarrow: false,
      font: { size: 10, color: '#fff' },
    }));
}

function chordColor(chord) {
  if (!chord || chord === 'N' || chord === 'X') return ROOT_COLORS['N'];
  const root = chord.split(':')[0];
  return ROOT_COLORS[root] || ROOT_COLORS['N'];
}

function addChordTimeline(container, data) {
  const card = document.createElement('div');
  card.className = 'chart-card';
  card.innerHTML = '<h3>Chord Timeline</h3>';

  const plotDiv = document.createElement('div');
  plotDiv.className = 'chart-plot';
  plotDiv.id = 'chordTimeline';
  card.appendChild(plotDiv);
  container.appendChild(card);
  allPlotIds.push(plotDiv.id);

  const shapes = [];
  const annotations = [];
  const yLabels = [];
  const tickVals = [];

  if (data.gt) {
    shapes.push(...makeShapes(data.gt.segments, 0.6, 1.0, seg => chordColor(seg.chord)));
    annotations.push(...makeAnnotations(data.gt.segments, 0.8, seg => seg.chord));
    yLabels.push('GT');
    tickVals.push(0.8);
  }

  if (data.pred) {
    shapes.push(...makeShapes(data.pred.segments, 0.0, 0.4, seg => chordColor(seg.chord)));
    annotations.push(...makeAnnotations(data.pred.segments, 0.2, seg => seg.chord));
    yLabels.push('Pred');
    tickVals.push(0.2);
  }

  const maxTime = Math.max(
    ...(data.gt?.segments || []).map(s => s.end),
    ...(data.pred?.segments || []).map(s => s.end),
    1
  );

  const hoverTraces = [];
  if (data.gt) {
    hoverTraces.push({
      x: data.gt.segments.map(s => (s.start + s.end) / 2),
      y: data.gt.segments.map(() => 0.8),
      text: data.gt.segments.map(s => `${s.chord}<br>${s.start.toFixed(2)}s - ${s.end.toFixed(2)}s`),
      hoverinfo: 'text',
      mode: 'markers',
      marker: { size: 0.1, opacity: 0 },
      showlegend: false,
    });
  }
  if (data.pred) {
    hoverTraces.push({
      x: data.pred.segments.map(s => (s.start + s.end) / 2),
      y: data.pred.segments.map(() => 0.2),
      text: data.pred.segments.map(s => `${s.chord}<br>${s.start.toFixed(2)}s - ${s.end.toFixed(2)}s`),
      hoverinfo: 'text',
      mode: 'markers',
      marker: { size: 0.1, opacity: 0 },
      showlegend: false,
    });
  }

  const layout = {
    ...PLOTLY_LAYOUT_BASE,
    height: 140,
    shapes,
    annotations,
    xaxis: { ...PLOTLY_LAYOUT_BASE.xaxis, range: [0, maxTime], title: 'Time (s)' },
    yaxis: {
      ...PLOTLY_LAYOUT_BASE.yaxis,
      range: [-0.05, 1.05],
      tickvals: tickVals,
      ticktext: yLabels,
      fixedrange: true,
    },
  };

  Plotly.newPlot(plotDiv, hoverTraces, layout, PLOTLY_CONFIG);
  setupClickHandler(plotDiv, data);
}

function addDiffTimeline(container, data) {
  const card = document.createElement('div');
  card.className = 'chart-card';
  card.innerHTML = '<h3>Match / Mismatch</h3>';

  const plotDiv = document.createElement('div');
  plotDiv.className = 'chart-plot';
  plotDiv.id = 'diffTimeline';
  card.appendChild(plotDiv);
  container.appendChild(card);
  allPlotIds.push(plotDiv.id);

  const shapes = data.diff.map(d => ({
    type: 'rect',
    x0: d.start, x1: d.end,
    y0: 0, y1: 1,
    fillcolor: d.match ? MATCH_COLOR : MISMATCH_COLOR,
    line: { width: 0.5, color: '#1a1d27' },
    layer: 'below',
  }));

  const mismatches = data.diff.filter(d => !d.match);
  const annotations = mismatches
    .filter(d => (d.end - d.start) >= 0.4)
    .map(d => ({
      x: (d.start + d.end) / 2,
      y: 0.5,
      text: `${d.gt_chord} → ${d.pred_chord}`,
      showarrow: false,
      font: { size: 9, color: '#fff' },
    }));

  const maxTime = Math.max(...data.diff.map(d => d.end), 1);

  const hoverTrace = {
    x: data.diff.map(d => (d.start + d.end) / 2),
    y: data.diff.map(() => 0.5),
    text: data.diff.map(d =>
      d.match
        ? `${d.gt_chord} (match)<br>${d.start.toFixed(2)}s - ${d.end.toFixed(2)}s`
        : `GT: ${d.gt_chord}<br>Pred: ${d.pred_chord}<br>${d.start.toFixed(2)}s - ${d.end.toFixed(2)}s`
    ),
    hoverinfo: 'text',
    mode: 'markers',
    marker: { size: 0.1, opacity: 0 },
    showlegend: false,
  };

  const layout = {
    ...PLOTLY_LAYOUT_BASE,
    height: 80,
    shapes,
    annotations,
    xaxis: { ...PLOTLY_LAYOUT_BASE.xaxis, range: [0, maxTime] },
    yaxis: {
      ...PLOTLY_LAYOUT_BASE.yaxis,
      range: [-0.05, 1.05],
      tickvals: [0.5],
      ticktext: ['Diff'],
      fixedrange: true,
    },
  };

  Plotly.newPlot(plotDiv, [hoverTrace], layout, PLOTLY_CONFIG);
}

function addComponentView(container, data) {
  const card = document.createElement('div');
  card.className = 'chart-card';
  card.innerHTML = '<h3>Decomposed Components (GT vs Pred)</h3>';

  const plotDiv = document.createElement('div');
  plotDiv.className = 'chart-plot';
  plotDiv.id = 'componentView';
  card.appendChild(plotDiv);
  container.appendChild(card);
  allPlotIds.push(plotDiv.id);

  const comps = ['root', 'bass', 'triad', 'misc', '6th', '7th', '9th', '11th', '13th']
    .filter(c => visibleComponents.has(c));

  if (comps.length === 0) return;

  const rowH = 1.0 / comps.length;
  const shapes = [];
  const annotations = [];
  const tickVals = [];
  const tickText = [];
  const hoverTraces = [];

  comps.forEach((comp, idx) => {
    const yBase = 1.0 - (idx + 1) * rowH;
    const yTop = yBase + rowH;
    const yMid = (yBase + yTop) / 2;
    tickVals.push(yMid);
    tickText.push(comp);

    const segments = data.component_diff[comp] || [];

    segments.forEach(seg => {
      const isRootOrBass = comp === 'root' || comp === 'bass';
      const colorVal = seg.match
        ? (isRootOrBass ? (ROOT_COLORS[seg.gt_value] || '#636e72') + '99' : MATCH_COLOR)
        : MISMATCH_COLOR;

      shapes.push({
        type: 'rect',
        x0: seg.start, x1: seg.end,
        y0: yBase + 0.02, y1: yTop - 0.02,
        fillcolor: colorVal,
        line: { width: 0.3, color: '#1a1d27' },
        layer: 'below',
      });
    });

    const labeled = segments.filter(s => (s.end - s.start) >= 0.8);
    labeled.forEach(seg => {
      const label = seg.match ? seg.gt_value : `${seg.gt_value}→${seg.pred_value}`;
      if (label !== 'N') {
        annotations.push({
          x: (seg.start + seg.end) / 2,
          y: yMid,
          text: label,
          showarrow: false,
          font: { size: 9, color: '#fff' },
        });
      }
    });

    hoverTraces.push({
      x: segments.map(s => (s.start + s.end) / 2),
      y: segments.map(() => yMid),
      text: segments.map(s =>
        s.match
          ? `${comp}: ${s.gt_value}<br>${s.start.toFixed(2)}s - ${s.end.toFixed(2)}s`
          : `${comp}: GT=${s.gt_value} Pred=${s.pred_value}<br>${s.start.toFixed(2)}s - ${s.end.toFixed(2)}s`
      ),
      hoverinfo: 'text',
      mode: 'markers',
      marker: { size: 0.1, opacity: 0 },
      showlegend: false,
    });
  });

  const maxTime = Math.max(
    ...Object.values(data.component_diff).flatMap(segs => segs.map(s => s.end)),
    1
  );

  const height = Math.max(comps.length * 40, 160);

  const layout = {
    ...PLOTLY_LAYOUT_BASE,
    height,
    shapes,
    annotations,
    xaxis: { ...PLOTLY_LAYOUT_BASE.xaxis, range: [0, maxTime], title: 'Time (s)' },
    yaxis: {
      ...PLOTLY_LAYOUT_BASE.yaxis,
      range: [-0.02, 1.02],
      tickvals,
      ticktext: tickText,
      fixedrange: true,
    },
  };

  Plotly.newPlot(plotDiv, hoverTraces, layout, PLOTLY_CONFIG);
  syncZoom();
}

// ── Interactions ──

function syncZoom() {
  if (allPlotIds.length < 2) return;

  const primary = document.getElementById(allPlotIds[0]);
  if (!primary) return;

  primary.on('plotly_relayout', (eventData) => {
    const x0 = eventData['xaxis.range[0]'];
    const x1 = eventData['xaxis.range[1]'];
    if (x0 === undefined || x1 === undefined) return;

    allPlotIds.slice(1).forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        Plotly.relayout(el, { 'xaxis.range[0]': x0, 'xaxis.range[1]': x1 });
      }
    });
  });
}

function setupClickHandler(plotDiv, data) {
  plotDiv.on('plotly_click', (eventData) => {
    if (!eventData.points || eventData.points.length === 0) return;
    const pt = eventData.points[0];
    const time = pt.x;

    const panel = document.getElementById('detailPanel');
    panel.classList.add('visible');

    document.getElementById('detailTime').textContent = `${time.toFixed(2)}s`;

    if (data.gt) {
      const seg = data.gt.segments.find(s => s.start <= time && time < s.end);
      document.getElementById('detailGT').textContent = seg ? seg.chord : '-';
    }
    if (data.pred) {
      const seg = data.pred.segments.find(s => s.start <= time && time < s.end);
      document.getElementById('detailPred').textContent = seg ? seg.chord : '-';
    }
  });
}

// ── Keyboard navigation ──

document.addEventListener('keydown', (e) => {
  if (!currentTrackData || !currentTrackData.diff) return;

  const mismatches = currentTrackData.diff.filter(d => !d.match);
  if (mismatches.length === 0) return;

  const plotEl = document.getElementById('chordTimeline');
  if (!plotEl || !plotEl.layout) return;

  const currentRange = plotEl.layout.xaxis.range;
  const center = (currentRange[0] + currentRange[1]) / 2;

  let target = null;

  if (e.key === 'ArrowRight' || e.key === 'n') {
    target = mismatches.find(m => m.start > center);
    if (!target) target = mismatches[0];
  } else if (e.key === 'ArrowLeft' || e.key === 'p') {
    const reversed = [...mismatches].reverse();
    target = reversed.find(m => m.end < center);
    if (!target) target = mismatches[mismatches.length - 1];
  }

  if (target) {
    const span = currentRange[1] - currentRange[0];
    const mid = (target.start + target.end) / 2;
    const newRange = [mid - span / 2, mid + span / 2];

    allPlotIds.forEach(id => {
      const el = document.getElementById(id);
      if (el) Plotly.relayout(el, { 'xaxis.range[0]': newRange[0], 'xaxis.range[1]': newRange[1] });
    });
  }
});

init();
</script>
