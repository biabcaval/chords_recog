# =============================================================================
# Audio & Feature Extraction
# =============================================================================

mp3:
  song_hz: 22050
  inst_len: 10.0
  skip_interval: 5.0

feature:
  n_bins: 252
  bins_per_octave: 36
  hop_length: 2048
  large_voca: True

# =============================================================================
# Training
# =============================================================================

experiment:
  learning_rate: 0.0001
  weight_decay: 0.001
  max_epoch: 100
  scheduler_t_max: 100
  batch_size: 128
  save_step: 40
  data_ratio: 0.8
  data_root: '/home/daniel.melo/datasets'
  dataset_names:
    - billboard
    - dj_avan_songbook1
    - dj_avan_songbook2
    - jaah
    - queen
    - robbiewilliams
    - rwc
    - balanced_v1_full

class_weights:
  enabled: True
  gamma: 0.5
  w_max: 10.0

gradnorm:
  enabled: True
  alpha: 0.7
  lr: 0.005
  eps: 1.0e-8
  w_min: 1.0e-3
  w_max: 10.0

focal:
  gamma: 0.0

# =============================================================================
# BEATs frontend (frozen Microsoft BEATs backbone -> decomposed multi-head)
# =============================================================================
# Used by scripts/preextract_beats_embeddings.py and train_beats_decomposed.py.
# The backbone is NOT on PyPI: clone microsoft/unilm and provide the checkpoint.
beats:
  embed_dim: 768                 # BEATs_iter3_plus_AS2M hidden size (frozen)
  target_sr: 16000               # BEATs requires 16kHz mono input
  beats_tag: 'beats_iter3_plus'  # subfolder tag for pre-extracted embeddings
  head_type: 'linear'            # 'linear' (paper baseline) or 'mlp'
  hidden_dim: 256                # MLP head hidden width (head_type=mlp only)
  dropout: 0.1                   # dropout inside classifier heads
  augment: 'none'               # pitch-shift set for pre-extraction: 'none'=[0], 'full'=[-5..6]
  checkpoint_path: '/home/daniel.melo/BEATS_checkpoints/BEATs_iter3_plus_AS2M.pt'  # BEATs checkpoint (.pt)
  source_path: '/home/daniel.melo/unilm/beats'                                     # cloned unilm/beats dir with BEATs.py
  # checkpoint / source default from config above, but can be overridden per run via CLI:
  #   --beats_checkpoint /path/BEATs_iter3_plus_AS2M.pt
  #   --beats_source     /path/unilm/beats

curriculum:
  enabled: False
  strategy: 'mixed'
  pacing: 'linear'
  start_ratio: 0.3
  pace_epochs: 30
  difficulty_threshold: 0.5
  warmup_epochs: 5

# =============================================================================
# Model — ChordMax (ChordFormer + decomposed multi-head output)
# =============================================================================

model:
  # --- Input geometry ---
  feature_size: 252          # Must match feature.n_bins
  timestep: 108              # Sequence length per encoder window

  # --- Conformer encoder ---
  num_layers: 12             # Number of Conformer blocks
  num_heads: 8               # Attention heads per block
  hidden_size: 128           # Channel width throughout the encoder
  conv_kernel_size: 31       # Depthwise-conv kernel (larger = wider temporal context)
  ff_expansion_factor: 4     # FFN expansion ratio inside Conformer blocks
  conv_expansion_factor: 2   # Conv module channel expansion ratio

  # --- Dropout ---
  input_dropout: 0.2         # Dropout at encoder input
  layer_dropout: 0.2         # Dropout inside each Conformer block
  output_dropout: 0.0        # Dropout in each decomposed output head

  # --- Output head FFN (ChordFormer only) ---
  use_head_ffn: False          # Add FFN bottleneck in each output head
  head_ffn_dim: null           # FFN hidden dim (default: hidden_size // 2)

  # --- Misc ---
  probs_out: False            # True = return raw logits; False = return argmax predictions

  # ---------------------------------------------------------------------------
  # Legacy (BTC backbone only — ignored by ChordFormer, kept for compatibility)
  # ---------------------------------------------------------------------------
  num_chords: 170
  loss: 'ce'
  attention_dropout: 0.2
  relu_dropout: 0.2
  total_key_depth: 128
  total_value_depth: 128
  filter_size: 128
  use_structured_output: False
  num_roots: 13
  num_qualities: 16
  num_bass: 13
  root_weight: 1.0
  quality_weight: 1.0
  bass_weight: 1.0

# =============================================================================
# Paths
# =============================================================================

path:
  ckpt_path: 'model'
  result_path: '/home/daniel.melo/BTC_ORIGINAL/chords_recog/BTC-ISMIR19/results'
  asset_path: '/home/daniel.melo/BTC_ORIGINAL/chords_recog/BTC-ISMIR19/assets'
  root_path: '/home/daniel.melo/datasets'
